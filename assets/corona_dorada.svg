<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d1"/>
      <stop offset=".28" stop-color="#ffd75e"/>
      <stop offset=".55" stop-color="#e09a1d"/>
      <stop offset=".78" stop-color="#ffe58c"/>
      <stop offset="1" stop-color="#c98516"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset=".5" stop-color="#e5a722"/>
      <stop offset="1" stop-color="#a86a10"/>
    </linearGradient>
    <radialGradient id="ruby" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ff8a9f"/>
      <stop offset=".45" stop-color="#d1203f"/>
      <stop offset="1" stop-color="#6b0a1f"/>
    </radialGradient>
    <radialGradient id="pearl" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#ffeebd"/>
      <stop offset="1" stop-color="#e8b64a"/>
    </radialGradient>
  </defs>
  <!-- cuerpo con 5 puntas -->
  <path d="M6 42 L2 14 L10 28 L17 10 L25 25 L32 3 L39 25 L47 10 L54 28 L62 14 L58 42 Z"
        fill="url(#metal)" stroke="#9a5f0c" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- brillo de la cara izquierda de cada pico -->
  <path d="M32 3 L25 25 L32 30 Z M17 10 L10 28 L17 31 Z M47 10 L39 25 L47 31 Z" fill="#fff" opacity=".28"/>
  <!-- banda inferior -->
  <rect x="5" y="35" width="54" height="9" rx="2.5" fill="url(#band)" stroke="#9a5f0c" stroke-width="1.1"/>
  <rect x="7" y="36.4" width="50" height="1.8" rx=".9" fill="#fff" opacity=".45"/>
  <!-- perlas en las puntas -->
  <g fill="url(#pearl)" stroke="#a8700f" stroke-width=".7">
    <circle cx="2" cy="13" r="2.6"/>
    <circle cx="17" cy="9" r="2.6"/>
    <circle cx="32" cy="2.6" r="3.1"/>
    <circle cx="47" cy="9" r="2.6"/>
    <circle cx="62" cy="13" r="2.6"/>
  </g>
  <!-- gemas en la banda -->
  <circle cx="32" cy="39.5" r="3.1" fill="url(#ruby)" stroke="#7a0d22" stroke-width=".7"/>
  <circle cx="18" cy="39.5" r="2" fill="url(#ruby)" stroke="#7a0d22" stroke-width=".6"/>
  <circle cx="46" cy="39.5" r="2" fill="url(#ruby)" stroke="#7a0d22" stroke-width=".6"/>
  <circle cx="31" cy="38.4" r=".9" fill="#fff" opacity=".85"/>
</svg>
